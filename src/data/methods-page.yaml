schema_version: hnc.public-page-contract.v1
page:
  id: methods
  route: /methods/
  navigation_current: methods
  title: "Methods · Hearth & Code"
  description: "Public working instruments for framing work, checking claims, and leaving a responsible return path."
  disposition:
    label: "Public practice layer"
    statement: "Methods is the public practice layer of Hearth & Code: small, inspectable instruments for framing work, selecting context, checking claims, using agents within boundaries, and leaving a responsible return path."
    boundary: "These are learning and working patterns, not universal prescriptions, efficacy guarantees, or permission to automate consequential decisions."
  slice_status: "Core method, field-card library, Technique Atlas explorer, catalog orientation, and synthetic teaching cases are present. Evaluation and return guidance remain bounded and non-efficacy claims."
hero:
  eyebrow: "Methods · public practice layer"
  title: "Methods that leave a way back."
  lede: "A method earns its place when it makes the next move clearer without hiding sources, uncertainty, authority, or the human judgment still required."
  entry_paths:
    - label: "Learn the core method"
      href: "#core-method"
      detail: "Four stations and eight working moves for answerable work."
    - label: "Browse field cards"
      href: "#field-library"
      detail: "Thirty-five bounded instruments, organized by practice family."
    - label: "Technique Atlas"
      href: "#prompt-lab"
      detail: "Browse 128 technique sheets with practical prompts and recorded demonstrations."
    - label: "Fieldcraft formalization series"
      href: "/fieldcraft/"
      detail: "Read 32 candidate mathematical dispositions for agentic work, with explicit evidence and proof limits."
core_method:
  id: core-method
  eyebrow: "Core method · return-bearing workshop"
  title: "Make the work inspectable before making it bigger."
  description: "The workshop is a memorable map, not a magic sequence. Its four stations hold eight working moves that can be scaled down for reversible work and made more explicit when stakes rise."
  stations:
    - number: "01"
      title: "Orient"
      phrase: "Name the decision and bind the closest sources."
      moves:
        - label: "Question"
          detail: "State the decision, inquiry, or artifact the work should support."
        - label: "Source"
          detail: "Name the records, observations, code, and people that can inform it."
    - number: "02"
      title: "Bound"
      phrase: "Set scope, authority, and the no-touch edges."
      moves:
        - label: "Scope"
          detail: "Say what may change, what must not, and what remains outside the attempt."
        - label: "Context"
          detail: "Assemble the smallest sufficient context and name meaningful exclusions."
    - number: "03"
      title: "Compose & check"
      phrase: "Make one inspectable artifact and test its named predicate."
      moves:
        - label: "Artifact"
          detail: "Produce a map, comparison, draft, check, or other object another person can inspect."
        - label: "Counterevidence"
          detail: "Test the stated predicate, seek failure cases, and separate observation from interpretation."
    - number: "04"
      title: "Decide & return"
      phrase: "Keep disposition human-held and preserve the next way back."
      moves:
        - label: "Human gate"
          detail: "Keep consequential meaning, acceptance, and release with the responsible person."
        - label: "Return"
          detail: "Record state, limits, owner, and one reliable next action before stopping."
practice_boundaries:
  eyebrow: "Practice boundaries"
  title: "Four small instruments before scale."
  description: "These records help a method stay legible. They are not bureaucracy for its own sake; each makes a different uncertainty or responsibility visible."
  instruments:
    - title: "Source ledger"
      detail: "What was consulted, in what role, with what omission or freshness limit."
    - title: "Claim card"
      detail: "What is being said, which evidence supports it, and what it does not establish."
    - title: "Check receipt"
      detail: "What was tested, on which input, with which outcome, and what remains unproven."
    - title: "Return record"
      detail: "Current state, owner, uncertainty, and one reliable way back in."
  human_boundary:
    agent_contribution: "Retrieve · compare · draft · implement · test · challenge"
    human_gate: "Meaning · authorship · consequential choice · public claim · release"
field_library:
  id: field-library
  eyebrow: "Public method field library"
  title: "Thirty-five methods, each with a boundary."
  description: "These cards are the primary working collection. Open a card to see when it is useful, a short method walk, costs and cautions, a bounded example, and the evaluation receipt with its limit."
  dataset: "publicMethodCollections"
  collection_ids:
    - semantic-orientation
    - operational-intelligence
    - prompt-practice
    - evaluation-return
  source_boundary: "Cards are public-safe learning instruments. Existing Codex examples are historical examples, not MiniMax comparisons; each field card requires the same technique-specific editorial and paired-run review before it is described as revised. A prompt, example output, or harness result does not grant capability, establish general effectiveness, or authorize an external effect."
prompt_lab:
  id: prompt-lab
  eyebrow: "Prompt, Context, and Agentic Technique Atlas"
  title: "Browse the Prompt, Context, and Agentic Technique Atlas."
  description: "Browse 128 selected Prompt, Context, and Agentic Technique Atlas entries by document and category. This is a navigable public projection, not the complete source corpus or the separate prompt-template catalog."
  boundary: "Atlas entries are synthesized public projections with stated source and evidence limits. A technique sheet or prompt template is not a capability grant, a production-efficacy claim, or authority to perform an external effect."
  batch_note: "Every selected technique opens four sections: Technique Introduction; Benefits, Trade-Offs, and Model Risk; How To Use; and Subagent Demonstration. The current run packet contains 128 distinct practical instructions across nine fictional work domains and sixteen matched task groups. Fifty-six entries received an additional source-grounded distinguishing check derived from that technique record’s candidate failure mode; previous responses for those exact earlier prompts remain in history and are not linked to the current prompt. All 128 current prompt hashes now have a Pi–Ember v5.3 Cognitectus run receipt using openai-codex/gpt-6-luna at high reasoning. A separate response review marked 113 records validated and 15 held with technique-specific notes. The recorded runs used offline startup without sessions, tools, context files, skills, prompt templates, or themes; token usage was not returned. A response is surfaced only when its exact prompt hash matches. These are candidate demonstrations, not evidence of general efficacy."
  catalog_relationship:
    title: "Four related records, four different jobs."
    intro: "The source Atlas, the selected public explorer, its linked prompt patterns, and the separate task-template drafts are different artifacts. Their counts are not rankings or evidence that a technique works."
    layers:
      - name: "Source Atlas"
        count: "512 candidate records · 64 categories · 16 documents"
        detail: "The source-only Prompt, Context, and Agentic Technique Atlas mixes source-derived projections with explicitly proposed Hearth & Code material. Its project record remains unreviewed, and the corpus is not evaluated for effectiveness."
      - name: "Public technique explorer"
        count: "128 technique entries · 16 documents · 64 categories"
        detail: "This is a selected technique-record projection. Each card opens an editorial exemplar or an explicit review hold in the same four-section review sheet: an audience-oriented introduction, benefits and model-risk discussion, a practical prompt, and its actual run status. The page does not expose prompt patterns as fillable forms. Unrun entries remain explicitly marked. Neither these technique records nor their practical prompts are the separate prompt-template catalog."
      - name: "Technique-linked prompt patterns"
        count: "128 records · one matched to each selected technique"
        detail: "These are fixed task instructions stored with the site data, linked by source ID, and pinned by exact prompt digest. The 128 entries use sixteen matched fixture groups across eight practical domains. The Methods route displays each prompt, response, source identity, and separate integrity/relevance status; it does not execute prompts and does not expose them as a form editor or model runner. They remain distinct from technique explanations and from the separate Prompt Template Catalog drafts."
      - name: "Prompt-template catalog"
        count: "Plan: 256 · expanded drafts: 512"
        detail: "A separate task-template catalog; its plan and expanded draft files currently disagree."
        notes:
          - label: "Planning contract"
            detail: "256 templates: four families per category — DIRECT, STRUCTURED, DELIBERATE, GOVERNED."
          - label: "Expanded draft files"
            detail: "All 64 category files and the current validator define eight families, adding RECURSIVE, GRAPH, EVALUATIVE, COMPOSITIONAL; structural validation passes at 512 templates."
          - label: "Review state and limit"
            detail: "The project README and planning contract still describe four families and 256 templates, while all 64 expanded category files and the current validator define eight families and 512 templates. The drafts remain candidate, review-required, verified:false, and are not browsable here. Structural validation does not establish quality, effectiveness, model compatibility, runtime availability, or registration."
  entry_paths:
    - label: "Understand the four related records"
      href: "#catalog-model-title"
      detail: "Separate technique records, the public selection, and task-template drafts."
    - label: "Browse the Technique Atlas"
      href: "#prompt-techniques"
      detail: "Browse 128 selected technique records by document and category."
    - label: "Learn from worked examples"
      href: "#worked-examples-title"
      detail: "Four fictional use cases, including an AI Literacy source-grounding example."
  worked_examples:
    title: "See the technique at work."
    intro: "These small, fictional teaching cases show a method’s shape. They are not live evaluations, client work, or evidence of effectiveness."
    cases:
      - name: "Compare research notes"
        task: "Given two fictional notes with source IDs, identify what each supports, where they conflict, and what remains unknown."
        method: "Ask for a claim-to-source table, a counterexample, and one follow-up observation that could change the conclusion."
        atlas_technique:
          id: "PTA-005-001"
          title: "Provenance-Carrying Chunk"
          slug: "33-provenance-carrying-chunk"
          fit: "Keeps source identity, locator, date, authority, and transformation beside each excerpt."
        input: "Note A [S1]: The prototype reduced median completion time from 8 to 6 minutes in 12 sessions. Note B [S2]: The sessions used internal volunteers; no comparison group was run."
        return: "Claim: completion time was lower in this small prototype sample [S1]. Limit: the notes do not show the change was caused by the prototype or generalizes beyond these sessions [S2]. Next check: inspect the session protocol and raw timing definition."
        limit: "The structure can make reasoning easier to inspect; it does not establish that the notes are true or the method is more accurate."
      - name: "Bound an agentic code review"
        task: "Ask an agent to inspect a fictional change set and identify likely defects."
        method: "Specify the repository paths it may inspect, files it must not change, evidence required per finding, output shape, and stop condition."
        atlas_technique:
          id: "PTA-004-006"
          title: "Contrastive-Fork Constraint and Non-Action Contracts"
          slug: "30-contrastive-fork-constraint-and-non-action-contracts"
          fit: "Compares materially different review routes while keeping prohibited changes explicit."
        input: "Review src/cache.ts and its unit tests for a possible stale-cache defect. Read-only: do not edit files, run network calls, or infer behavior outside the supplied code and tests. Return finding, exact file/line evidence, confidence, and one missing check; stop after the review."
        return: "Finding: unknown until code and tests are inspected. Required result shape: claim and locator, supporting code path, counterexample or test evidence, confidence basis, and the smallest follow-up check. No defect or successful review is implied by this teaching prompt."
        limit: "A bounded prompt does not enforce filesystem permissions or prove that an agent stayed within scope."
      - name: "Extract decisions from a design brief"
        task: "Turn a fictional project brief into decisions, owners, open questions, and source references."
        method: "Compare a direct instruction with a structured schema, then check whether each extracted item maps to source text and whether any item is missing."
        atlas_technique:
          id: "PTA-003-001"
          title: "Outcome-First Contract"
          slug: "17-outcome-first-contract"
          fit: "Defines the observable completed state before choosing an implementation approach."
        input: "Brief [B1]: 'Pilot the import with two teams in October. Maya owns the data mapping. Decide whether to retain original IDs after security review.'"
        return: "Decision: pilot with two teams in October [B1]. Owner: Maya for data mapping [B1]. Open question: retain original IDs? Gate: security review [B1]. No deadline or decision outcome beyond the quoted brief is inferred."
        limit: "A useful extraction example is not a comparative efficacy result; evaluation requires a defined dataset and review method."
      - name: "Explain AI Literacy guidance without inventing a test"
        task: "Prepare an internal orientation note for an organization reviewing its AI Literacy practices. Separate EU AI Act Article 4 guidance from a school-focused literacy framework, and give the reader source-linked questions to take to counsel."
        method: "Use Evidence-per-Claim: attach each material statement to a named source, identify who or what it applies to, and state the inferential gap. Keep legal interpretation as an open question for the organization and its counsel."
        atlas_technique:
          id: "PTA-006-001"
          title: "Evidence-per-Claim"
          slug: "41-evidence-per-claim"
          fit: "Binds material claims to source units and labels the inferential gap; the Atlas record remains a synthesized candidate projection, not evaluated advice."
        input: "Source [G1], Regulation (EU) 2026/1744 as incorporated into AI Act Article 4(1): providers and deployers take measures supporting staff and other persons acting on their behalf, considering their knowledge, experience, education, training, use context, and the people or groups on whom systems are used; no specific individual literacy level is required. Source [G2], European Commission AI Literacy Q&A: its later amendment answer says no specific or 'sufficient' individual level is mandated and no person-by-person measure or certificate is required, but its opening summary still says 'ensure a sufficient level.' Source [G3], OECD/European Commission framework: AI literacy framework for primary and secondary education."
        return: "Claim [G1]: the amended legal text requires context-sensitive organizational measures and consideration of affected people/groups, not a guaranteed literacy level for each person. Claim [G2]: the Commission FAQ describes no individual measurement/certificate duty, but its opening summary conflicts with its updated answer; anchor the legal claim to [G1] and preserve the FAQ mismatch. Claim [G3]: the named framework is scoped to primary and secondary education. Open question: which measures fit this organization's systems, roles, and existing training? Human review: ask counsel about obligations in the organization's circumstances."
        limit: "This fictional note is not legal advice or a complete compliance analysis. The official FAQ contains a stale opening summary; the prompt technique does not resolve legal ambiguity, verify the sources, decide organizational duties, or establish literacy."
        sources:
          - title: "Regulation (EU) 2026/1744 amending AI Act Article 4"
            href: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"
          - title: "AI Act consolidated text as of 27 July 2026, Article 4"
            href: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02024R1689-20260727"
          - title: "European Commission AI Literacy — Questions & Answers"
            href: "https://digital-strategy.ec.europa.eu/en/faqs/ai-literacy-questions-answers"
          - title: "OECD / European Commission AI Literacy Framework"
            href: "https://www.oecd.org/en/publications/empowering-learners-for-the-age-of-ai_65cd27d4-en.html"
          - title: "Hearth & Code AI Literacy position and source notes"
            href: "/philosophy/ai-literacy/"
    observed_system_trace:
      eyebrow: "Historical article report · source readback unavailable"
      title: "A typed request crosses a guarded model boundary."
      task: "Return one bounded response through an explicitly admitted local model route."
      design: "Sigil defines request and response types. A delegating function declares the matching llm/Request effect; evaluation requires an admitted capability and a matching route. A provider-registry name alone does not grant access."
      observation: "The linked 2026-09-23 article reports one local canary returning an Ok value matching the declared response shape, with a provider-executed receipt and no schema deviation."
      limit: "This review could not reopen the cited private implementation or receipt from the current source checkouts. Treat this as a historical report, not independently rechecked evidence or a statement about current runtime behavior. It establishes no answer correctness, task usefulness, safety, provider breadth, or general reliability."
      source_title: "When the Language Can Call a Model"
      source_href: "/journal/when-the-language-can-call-a-model/"
    related_articles:
      title: "Continue from example to working system."
      items:
        - title: "Specification-driven prompting"
          href: "/journal/specification-driven-prompting/"
          detail: "A first-person proposal for contracts that name task inputs, boundaries, and return conditions; no general performance result is claimed."
        - title: "When the language can call a model"
          href: "/journal/when-the-language-can-call-a-model/"
          detail: "A public-safe technical account of typed model calls, effect descriptions, checks, and limits in a local canary."
        - title: "Every claim needs a trail back home"
          href: "/journal/every-claim-needs-a-return-route/"
          detail: "A working tour of provenance and correction paths, including what those mechanisms cannot establish."
next_slice:
  title: "Continue into practice"
  detail: "Browse the field library, visit the agentic engineering workbench, or read the AI Literacy position. Evaluation evidence and return guidance are labeled by their actual status."
