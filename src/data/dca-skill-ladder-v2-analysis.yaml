schema_version: hnc.prompt-skill-ladder-analysis.clean-pi.v1
slug: 01-dynamic-context-assembly
review_status: candidate-needs-revision
briefing:
  title: Four independently authored prompts for one catering decision
  orientation: Four fully authored prompts use distinct source coverage and framing. These responses were captured through a fresh Pi config directory without Hub/project mounts, AGENTS, APPEND_SYSTEM or explicitly loaded extensions; one sample per style still cannot establish causality or user skill.
  observed_shift: In this clean run the DCA-focused response explicitly selects four decision slots, retires stale stock without discarding menu prices, excludes unconfirmed pasta from pricing, and leaves the 24th allergy meal and its price unresolved. Its advantage here is inspectable source selection, not a completed safe order.
  counterweight: The casual response mislabels chickpea as vegan and offers an unverified allergy allocation; the power response treats an unverified rice bowl as tentatively reserved; the engineer response says two meals remain unpriced even though chickpea capacity exists, and suggests an unverified tahini-free substitution; the DCA response incorrectly treats one-special-meal wording as proof that dietary groups cannot overlap, and calls pasta unsuitable for vegetarian guests rather than merely unconfirmed for Friday stock.
  next_decision: Keep all four as review candidates. The clean route removes a known system-append contamination path, but neither it nor the DCA prompt guarantees correct safety, arithmetic or source interpretation. No customer message is ready to send.
criteria:
  - id: input_coverage
    label: Information actually supplied
  - id: freshness
    label: Friday stock and source precedence
  - id: capacity
    label: Arithmetic and complete-price boundary
  - id: dietary
    label: Sesame and cross-contact boundary
  - id: timing
    label: Delivery-slot truthfulness
  - id: source_trace
    label: Inspectable source selection
  - id: customer_reply
    label: Safe provisional customer draft
assessments:
  - id: casual
    headline: Short request; a priced mix, but unsafe dietary assumptions.
    summary: The model prices 18 rice plus 6 chickpea correctly, but calls chickpea vegan despite the menu saying only vegetarian, assigns an unverified rice meal to the allergy guest and offers a send-as-is customer draft.
    findings:
      - criterion: input_coverage
        result: partly_met
        note: The prompt is conversational and omits full source identity and formal timestamps.
      - criterion: freshness
        result: partly_met
        note: It uses the latest recalled stock but asks whether wraps are truly unavailable, reflecting the partial input.
      - criterion: capacity
        result: met
        note: 18 plus 6 bowls total 24 for $264 under $360, using the stated stock and prep limits.
      - criterion: dietary
        result: not_met
        note: Chickpea is incorrectly called vegan and the allergy guest is tentatively assigned unverified rice without established cross-contact safety.
      - criterion: timing
        result: not_observable
        note: The casual prompt names the requested window but supplies no kitchen open-slot record.
      - criterion: source_trace
        result: not_met
        note: The answer does not distinguish menu, supplier and kitchen authority or field-level supersession.
      - criterion: customer_reply
        result: not_met
        note: It says the draft can be sent as-is while allergen safety is unresolved and misstates the chickpea dietary property.
  - id: power
    headline: Good table and freshness, but risky reservation wording.
    summary: The response calculates 24 meals and $264 correctly and handles Thursday stock, but writes that a rice bowl is tentatively reserved for the allergy guest when no reservation or safety confirmation exists. It asks for extra information not necessary to establish the stated severe allergy.
    findings:
      - criterion: input_coverage
        result: met
        note: The practical note contains the menu, Monday and Thursday supplier updates, kitchen capacity and dietary request.
      - criterion: freshness
        result: met
        note: Thursday quantities override Monday counts while Monday menu prices remain in use.
      - criterion: capacity
        result: met
        note: 18 rice plus 6 chickpea bowls total 24 and $264; the model keeps pasta out of the priced mix.
      - criterion: dietary
        result: partly_met
        note: The ingredient and handling checks are named, but the drafted reply describes a rice bowl as tentatively reserved for an unverified severe-allergy guest.
      - criterion: timing
        result: partly_met
        note: The slot is called open but stock and meal language includes tentative reservation claims.
      - criterion: source_trace
        result: partly_met
        note: Timeline is visible, but there is no explicit task-time context selection or omission ledger.
      - criterion: customer_reply
        result: partly_met
        note: Marked provisional, yet tentative reservation and firm-confirmation language is premature.
  - id: engineer
    headline: Safety hold is strong; illustrative quantity logic is muddled.
    summary: The model refuses a complete safe order, cites R1–R5 and holds allergy ingredients and handling. It then gives an illustrative 4-chickpea plus 18-rice mix and calls two remaining meals unpriceable, although up to 12 extra chickpea bowls are possible; it also proposes simply removing tahini without evidence that this would address cross-contact.
    findings:
      - criterion: input_coverage
        result: met
        note: All five source records were provided in a bounded task contract.
      - criterion: freshness
        result: met
        note: R4 is used for Friday stock while R2 remains the price source.
      - criterion: capacity
        result: partly_met
        note: No complete safe price is asserted, but the illustrative 22-meal mix misstates why the next ordinary meals would be unpriceable.
      - criterion: dietary
        result: partly_met
        note: Severe-allergy allocation is held, yet the suggested tahini-free chickpea substitution does not establish sesame-safe handling.
      - criterion: timing
        result: met
        note: The response makes no booking claim for the open slot.
      - criterion: source_trace
        result: partly_met
        note: Records are individually cited but not reduced to a task-sized selection with explicit exclusions.
      - criterion: customer_reply
        result: partly_met
        note: The reply is non-binding, but suggests the eventual total will fit the cap without a priced allergy-safe option.
  - id: engineer_dca
    headline: Clear source selection and bounded subtotal; one source inference remains wrong.
    summary: The response selects four context slots, retires Monday counts for Friday stock, retains menu prices, and explicitly prices only 23 non-allergy meals at $253. It cannot complete the order. It nevertheless treats “no guest needs more than one special meal” as proof that dietary categories are disjoint and says pasta cannot serve vegetarian guests when the real limitation is unconfirmed Friday stock and allergen profile.
    findings:
      - criterion: input_coverage
        result: met
        note: All five source records are available as a purpose-built drawer.
      - criterion: freshness
        result: met
        note: S1 supersedes S0 Friday quantities without discarding M prices.
      - criterion: capacity
        result: met
        note: 18 rice plus 5 chickpea are correctly priced as 23 meals at $253; the 24th item and full price remain unknown.
      - criterion: dietary
        result: partly_met
        note: The allergy meal is held for ingredient and handling checks, but dietary groups are incorrectly assumed disjoint from the one-special-meal wording.
      - criterion: timing
        result: met
        note: The slot remains open rather than reserved.
      - criterion: source_trace
        result: met
        note: Four selected slots, dates and exclusions are explicit before drafting.
      - criterion: customer_reply
        result: partly_met
        note: It correctly says only 23 meals are priced, but asks unnecessary overlap clarification and cannot be sent as a complete order.
