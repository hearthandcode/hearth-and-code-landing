  - catalog_position: 3
    slug: 09-emotion-prompting
    status: revise_before_teaching
    technique_observation: The fourth prompt adds a model-directed affective salience cue rather than merely requesting warmer audience copy. Its output keeps most event facts and a non-shaming tone.
    counterweight: The applied invitation invents a ten-minute stay option, explicitly calls it a drafting choice, and still omits the prohibition's point. Engineer baseline is at least as accurate on logistics. One pair cannot show affective framing improves output.
    rubric_ids:
      - logistics
      - topics
      - no_invented_access_options
      - respectful_voluntary_tone
    tiers:
      - id: casual
        observations:
          - met
          - not_observable
          - not_met
          - met
        finding: Saturday time, room and free drop-in appear; workshop topics and account boundary were absent from the prompt, while the response invents extra topics, helpers and optional device bringing.
      - id: power
        observations:
          - met
          - met
          - met
          - met
        finding: Preserves event facts, no-account rule and invitation tone without a made-up short-stay policy or measured outcome.
      - id: engineer
        observations:
          - met
          - met
          - partly_met
          - met
        finding: Strong factual checklist, but response adds bringing devices and demonstration materials not stated in the facts; the no-account rule remains clear.
      - id: engineer_technique
        observations:
          - met
          - met
          - not_met
          - met
        finding: Affective cue is model-directed, but response says patrons may stay ten minutes despite no source supporting a short visit; no general effect can be inferred.
