schema_version: hnc.prompt-technique-batch-ladder-analysis.v1
batch_id: PTA-PUBLIC-B01
review_status: candidate-needs-revision
owner_disposition: pending
source_candidate_verified: false
methodology:
  evidence: 32 distinct final MiniMax-M3 responses from fresh-home, no-Hub, no-tool Pi turns; one response per tier and technique
  interpretation: descriptive contrast of prompting styles with different information coverage, not a controlled causal experiment or a ranking of users
  review_passes:
    - adversarial_facts_and_effects
    - source_mechanism_alignment
    - task_rubric
    - cross_tier_confounds
    - public_safety
    - response_completeness
    - browser_readability
  non_claim: No aggregate score, reliability estimate, general efficacy result, publication approval or permission to use any generated professional advice follows from these observations.
entries:
  - catalog_position: 2
    slug: 06-contrastive-fork-instruction-hierarchy-and-precedence
    status: revise_before_teaching
    technique_observation: The fourth response visibly classifies policy above chat and compares transfer versus manager exception with route-specific rejection conditions. That structure is more inspectable than the casual reply, which lacks the policy in its prompt.
    counterweight: The applied answer invents possible manager criteria and incorrectly says the lead cannot trigger a manager request; the supplied note only limits who may approve an exception. The power response says the customer is unhappy with the workshop, while the email says plans changed.
    rubric_ids:
      - precedence
      - no_invented_transfer_or_refund
      - material_routes
      - authority_gates
    tiers:
      - id: casual
        observations:
          - not_observable
          - met
          - not_observable
          - partly_met
        finding: With no policy supplied, the draft appropriately defers the refund decision but promises a follow-up without a known response time. Policy precedence and a two-route comparison cannot be fairly judged from this prompt.
      - id: power
        observations:
          - met
          - met
          - partly_met
          - partly_met
        finding: Applies the 48-hour policy but adds that the customer was dissatisfied with the workshop, an invented reason for the request; manager review is held, but sending authority is not cleanly established.
      - id: engineer
        observations:
          - met
          - met
          - partly_met
          - met
        finding: Separates draft and send, flags unknown transfer fees and rejects chat as policy. Produces one preferred route rather than two materially contrasted mechanisms.
      - id: engineer_technique
        observations:
          - met
          - partly_met
          - met
          - partly_met
        finding: Compares distinct routes and checks their own disqualifiers, but adds hypothetical manager rules as if relevant and overstates the lead's inability to request escalation. Review the customer draft before use.
    reviewed_response_sha256:
      casual: 51b2ac3b16e7d57a855348e5277d6b8b6c602a71c381604e4aa04c0d0ae1e2cf
