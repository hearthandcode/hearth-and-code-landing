  - catalog_position: 5
    slug: 17-outcome-first-contract
    status: block_example_until_revised
    technique_observation: The fourth response opens with a proposed measurable result, separates a positions snapshot from a reproducible fixture and names owner-chosen guardrails before comparing synonyms and weights.
    counterweight: It includes a logically invalid rejection rule—reject the target if a null baseline does not already meet it on at least one query—although all three supplied ranks fail the target by design. It also invents testing architecture and owner policy beyond the packet. The generated brief cannot teach a correct acceptance gate as-is.
    rubric_ids:
      - named_queries_and_ranks
      - proposed_target
      - untested_levers
      - regression_and_rollback
    tiers:
      - id: casual
        observations:
          - not_observable
          - not_observable
          - partly_met
          - not_observable
        finding: Suggests search synonyms and content changes without a rank snapshot or target in the prompt; cannot be graded on ranks or guardrails.
      - id: power
        observations:
          - met
          - met
          - partly_met
          - met
        finding: Uses given ranks and calls top-three proposed, but invents extra levers, a multiweek measurement plan and confidence about which change is likely to help.
      - id: engineer
        observations:
          - met
          - met
          - met
          - met
        finding: Recognizes snapshot limits and proposes fixtures, guardrail queries and rollback questions without claiming execution; some scoring-signal examples remain hypothetical.
      - id: engineer_technique
        observations:
          - met
          - partly_met
          - met
          - partly_met
        finding: Outcome-first form is strong, but the invalid null-baseline rejection rule undermines the central mechanism and requires correction before public teaching use.
    reviewed_response_sha256:
