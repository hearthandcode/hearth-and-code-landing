  - catalog_position: 4
    slug: 16-staged-composition-task-framing-and-intent-normalization
    status: revise_before_teaching
    technique_observation: The applied output uses five stages with input, output and stop conditions; it holds database access and lists unknown log medium rather than silently granting access.
    counterweight: It changes who performs greeting—coordinator greets the volunteer instead of volunteers greeting visitors—and removes book sorting from the retained checklist solely because lifting training is unresolved, although sorting need not entail lifting.
    rubric_ids:
      - confirmed_tasks
      - database_and_trainer
      - log_medium
      - stage_stops
    tiers:
      - id: casual
        observations:
          - partly_met
          - not_observable
          - partly_met
          - not_observable
        finding: Invents a timed agenda, greeting script, sorting categories and paperwork; database prohibition and trainer gap were not supplied at this tier.
      - id: power
        observations:
          - partly_met
          - met
          - met
          - not_observable
        finding: Holds database permission and asks about trainer, but invents shadowing, badge and venue logistics; it is not a staged-composition prompt.
      - id: engineer
        observations:
          - met
          - met
          - met
          - not_observable
        finding: Compact source-traced checklist with unknown owners and log medium; no invented access, but no explicit five-stage stop sequence.
      - id: engineer_technique
        observations:
          - not_met
          - met
          - met
          - met
        finding: Five-stage structure is visible, but a core task's actor is reversed and book sorting is over-held. Stage conformance cannot substitute for source-fact fidelity.
