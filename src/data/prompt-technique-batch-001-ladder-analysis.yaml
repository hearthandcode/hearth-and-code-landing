    status: revise_before_teaching
    technique_observation: The applied answer distinguishes a private corrected draft from an inert request packet and keeps website and subscriber-email approvals separate.
    counterweight: It treats the absence of an established scheduler as proof none exists, and asserts that two approvals cannot fit the overnight interval without timing evidence. Those are risk hypotheses, not route-disqualifying facts.
    rubric_ids:
      - east_gate_and_weather
      - material_routes
      - separate_approvals
      - no_invented_effects
    tiers:
      - id: casual
        observations:
          - met
          - not_observable
          - partly_met
          - partly_met
        finding: Uses east gate but promises weather updates at an unspecified channel; coordinator approval rules were not supplied at this tier.
      - id: power
        observations:
          - met
          - partly_met
          - met
          - met
        finding: Creates two channel-specific draft texts with separate holds, not two materially different preparation workflows; does not publish.
      - id: engineer
        observations:
          - met
          - partly_met
          - met
          - met
        finding: Source-bound private packet and two approval questions; no contrastive fork, but no publication effect claimed.
      - id: engineer_technique
        observations:
          - met
          - met
          - met
          - partly_met
        finding: Two workflows are materially distinct, but assumed scheduler absence and inferred timing impossibility weaken its claimed disqualifiers.
