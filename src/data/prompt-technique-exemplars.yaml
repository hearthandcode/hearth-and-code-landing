schema_version: hnc.prompt-technique-exemplars.v1
entries:
  - slug: 01-dynamic-context-assembly
    review_status: candidate
    mechanism: Assemble only decision-relevant source units at task time, resolve field-level freshness and authority, carry exclusions and unknowns, then use a traceable working brief to constrain the answer.
    setting: A reusable pattern for operations, engineering, research and creative production when several changing inputs bear on one decision.
    applied_process:
      - title: Define the decision and context slots
        detail: Name the intended output and which facts could change it. In operations this might be capacity and timing; in engineering compatibility and rollback; in research source quality and uncertainty; in creative production audience and format constraints.
      - title: Retrieve and reconcile source units
        detail: Select relevant records with dates, authority and scope. Resolve conflicting claims field by field rather than letting one newer note replace all older facts; mark superseded claims and unresolved conflicts.
      - title: Assemble a bounded working brief
        detail: Order facts by decision impact, retain their source locators and list material omissions. Include enough context for the task without dumping an entire archive or erasing provenance in a summary.
      - title: Draft and check against the brief
        detail: Produce the requested artifact from the selected facts; test consequential claims against sources, arithmetic and dependencies. If a required fact is absent, stop the affected claim and ask the narrowest useful question.
    when_to_use:
      - title: Context varies by task
        detail: Use when one collection serves several decisions and each needs a different source subset, ordering or budget; a fixed giant prompt would obscure the facts that decide this task.
      - title: Sources disagree or age differently
        detail: Use when a current operations update supersedes part of an older plan, or when primary evidence and commentary have different roles; keep conflicts visible rather than averaging them.
      - title: The output needs traceable inputs
        detail: Use when a reviewer must identify which sources support a specification, recommendation, creative constraint or research synthesis and which facts were intentionally omitted.
      - title: A direct source suffices
        detail: Skip elaborate assembly for a low-stakes question answered by one current authoritative record. If the essential source is missing, no amount of context formatting makes the answer reliable.
    limitations:
      - title: Selection can hide counterevidence
        detail: A relevance filter can omit a safety constraint, dissenting study, breaking API change or creative requirement. Cross-check the assembled brief against the original source inventory before acting.
      - title: Freshness does not confer authority
        detail: A recent chat may be provisional or less authoritative than an approved rule. Reconcile claims by effective date and source role; hold conflicts if those are unknown.
      - title: Compression loses granularity
        detail: A short brief does not replace an ingredient list, technical test log or primary research article. Keep locators and omissions so a person can reopen the originals.
      - title: A brief does not perform work
        detail: Context selection supports a draft, not verification, deployment, purchase, diagnosis or release. The model may still invent specifics; review output against the source packet and retain the responsible human decision.
    example:
      scenario: Catering lunch proposal for 24 people
      comparison_predicate: Does the response distinguish current from stale availability, stay within budget and delivery window, preserve the dietary unknown, and avoid claiming an order was placed?
      source_packet:
        - 'Customer email, Tuesday 10:00: Friday delivery 12:00–12:30; 24 lunches; budget at most $360 before tax; 4 vegetarian, 2 dairy-free, 1 severe sesame allergy. No person needs more than one special meal.'
        - 'Menu sheet, Monday: chicken wrap $12; chickpea bowl $11 (vegetarian, contains tahini/sesame); tomato pasta $10 (vegetarian; dairy status not specified); rice-and-bean bowl $11 (vegan, supplier ingredient list not attached).'
        - 'Supplier sheet, Monday: 30 chicken wraps and 30 rice-and-bean bowls available.'
        - 'Supplier update, Thursday 09:00: chicken wraps unavailable Friday; 18 rice-and-bean bowls confirmed; tomato pasta ingredients not verified for dairy or sesame.'
        - 'Kitchen note, Thursday 11:00: can prepare at most 12 additional chickpea bowls; Friday 12:00–12:30 delivery slot still open; no ingredient-level sesame verification yet for rice-and-bean bowls.'
      task: Draft a feasible provisional lunch plan and a short customer reply; do not place an order. State any facts needing confirmation before a binding quote.
      baseline_instruction: Use the supplied facts to answer the task. Keep the reply concise.
      applied_instruction: |-
        Before drafting, build a decision-sized working brief from the source packet—not a summary of every line.
        1. Set four slots for this order: dietary constraints, Friday item availability, delivery timing, and cost ceiling. For each slot, select only the facts that could change the proposed quantities or whether we may promise a meal; keep its source and timestamp beside it.
        2. Reconcile facts that address the same slot. Use Thursday's supplier update instead of Monday's stock counts for Friday quantities. Keep the Monday counts only as an explicitly superseded record. Treat the menu as evidence of price and listed ingredients, not evidence of Friday stock or allergen clearance. Do not convert an open delivery slot into a held reservation.
        3. Mark absent confirmations as unknown, especially sesame ingredients and kitchen cross-contact. Keep tomato pasta outside the priced allocation because no Friday quantity is confirmed. Use at most 18 rice-and-bean bowls and 12 additional chickpea bowls. The customer explicitly says no guest has more than one special meal; do not ask whether dietary groups overlap.
        4. Draft a provisional 24-meal quantity mix and arithmetic from the working brief, then a short customer reply. Show which meal cannot be promised for the severe-allergy guest until ingredient and handling checks clear. If no verified sesame-safe meal exists, do not claim the complete order is feasible or send a binding quote. State what the person must confirm; do not place or reserve anything.
        Check the draft against all four slots and the excluded/superseded records before returning it.
