<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn banner source
  Canvas: 1584 × 396 px (4:1)
  Purpose: recruiter-facing profile header for Scott Rallya.
  Text is deliberately vector-authored rather than image-model text.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title description">
  <title id="title">Scott Rallya, Applied AI Engineer</title>
  <desc id="description">A dark neon knowledge-graph landscape with a professional Applied AI Engineer headline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040c"/>
      <stop offset="0.52" stop-color="#08071c"/>
      <stop offset="1" stop-color="#12041d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#13e7db" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#13e7db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="1" cy="0.72" r="0.92">
      <stop offset="0" stop-color="#c738ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#c738ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14e8dc" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#14e8dc" stop-opacity="0.68"/>
      <stop offset="0.55" stop-color="#8c4cff" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#ed38d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ed38d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17efe1" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#16e7de" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#e93add" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="lineViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6fff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#9d4dff" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#f438db" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="fineGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#4e4b85" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <rect width="1584" height="396" fill="url(#fineGrid)" opacity="0.32"/>
  <ellipse cx="200" cy="404" rx="620" ry="260" fill="url(#cyanGlow)"/>
  <ellipse cx="1370" cy="330" rx="680" ry="300" fill="url(#violetGlow)"/>
  <path d="M 0 238 C 310 206, 562 235, 776 220 S 1254 203, 1584 230" fill="none" stroke="url(#horizon)" stroke-width="2" filter="url(#softGlow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 319 L 94 288 L 179 320 L 290 270 L 385 302 L 505 235 L 620 283 L 727 242" stroke="url(#lineCyan)" stroke-width="2.2"/>
    <path d="M 0 356 L 120 323 L 214 365 L 348 305 L 447 343 L 559 282 L 686 329 L 810 274" stroke="url(#lineCyan)" stroke-width="1.4" opacity="0.76"/>
    <path d="M 46 242 L 94 288 L 120 323 L 179 320 L 214 365 M 179 320 L 290 270 L 348 305 M 290 270 L 385 302 L 447 343 M 385 302 L 505 235 L 559 282 M 505 235 L 620 283 L 686 329 M 620 283 L 727 242 L 810 274" stroke="url(#lineCyan)" stroke-width="1.25" opacity="0.78"/>
    <path d="M 705 279 L 826 233 L 935 270 L 1056 231 L 1176 281 L 1285 245 L 1402 289 L 1584 239" stroke="url(#lineViolet)" stroke-width="1.8" opacity="0.73"/>
    <path d="M 732 340 L 856 286 L 962 341 L 1094 276 L 1210 336 L 1335 284 L 1452 342 L 1584 296" stroke="url(#lineViolet)" stroke-width="1.3" opacity="0.58"/>
    <path d="M 727 242 L 826 233 L 856 286 L 935 270 L 962 341 M 935 270 L 1056 231 L 1094 276 M 1056 231 L 1176 281 L 1210 336 M 1176 281 L 1285 245 L 1335 284 M 1285 245 L 1402 289 L 1452 342" stroke="url(#lineViolet)" stroke-width="1.1" opacity="0.64"/>
    <path d="M 96 288 C 186 238, 322 222, 505 235 S 665 236, 826 233" stroke="#16e7de" stroke-width="0.85" opacity="0.38"/>
    <path d="M 620 283 C 789 207, 1025 220, 1285 245 S 1460 259, 1584 239" stroke="#d541e8" stroke-width="0.85" opacity="0.38"/>
  </g>

  <g filter="url(#softGlow)">
    <g fill="#19eee2">
      <circle cx="94" cy="288" r="4.4"/><circle cx="179" cy="320" r="3.3"/><circle cx="290" cy="270" r="3.8"/>
      <circle cx="385" cy="302" r="3"/><circle cx="505" cy="235" r="3.8"/><circle cx="620" cy="283" r="3.2"/>
      <circle cx="120" cy="323" r="2.5"/><circle cx="348" cy="305" r="2.2"/><circle cx="559" cy="282" r="2.2"/>
    </g>
    <g fill="#e93ddb">
      <circle cx="826" cy="233" r="3.3"/><circle cx="935" cy="270" r="3.8"/><circle cx="1056" cy="231" r="2.6"/>
      <circle cx="1176" cy="281" r="3.7"/><circle cx="1285" cy="245" r="2.9"/><circle cx="1402" cy="289" r="4.2"/>
      <circle cx="856" cy="286" r="2.3"/><circle cx="1094" cy="276" r="2.2"/><circle cx="1335" cy="284" r="2.2"/>
    </g>
  </g>

  <g transform="translate(560 97)">
    <text x="0" y="0" fill="#75f7ec" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4.3">SCOTT RALLYA</text>
    <text x="0" y="60" fill="#fbf7ff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6">Applied AI Engineer</text>
    <rect x="0" y="84" width="121" height="2" rx="1" fill="#24e7dd"/>
    <rect x="130" y="84" width="48" height="2" rx="1" fill="#ba4cff"/>
    <text x="0" y="123" fill="#d9d4ea" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="500" letter-spacing="0.3">Knowledge Systems  •  AI Governance  •  Agentic Workflows</text>
    <text x="0" y="155" fill="#a6a1bb" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="1.25">KNOWLEDGE SYNTHESIS  /  PROVENANCE  /  RESEARCH ENGINEERING</text>
  </g>

  <rect x="0.5" y="0.5" width="1583" height="395" fill="none" stroke="#a95eea" stroke-opacity="0.28"/>
</svg>
